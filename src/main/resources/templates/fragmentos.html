<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragmentos reutilizables. Cada página los incluye con th:replace, por ejemplo:
  <head th:replace="~{fragmentos :: cabecera('Tareas')}"></head>
-->
<head th:fragment="cabecera(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · GTM'">GTM</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="barra" th:fragment="navegacion">
  <a class="marca" th:href="@{/tareas}">GTM <small>Gestión de Tareas</small></a>
  <nav>
    <a th:href="@{/tareas}">Tareas</a>
    <a th:href="@{/tareas/nueva}">Nueva tarea</a>
  </nav>
</header>
<footer class="pie" th:fragment="pie">
  <span>GTM · Módulo Tareas · SENA ADSI</span>
  <span>Spring Boot + Thymeleaf</span>
</footer>
</body>
</html>
