# ---------------------------------------------------------------------------
# GTM - Módulo Tareas (Spring Boot)
# La clave de MySQL NO va aquí: se escribe en application-local.properties,
# que está en .gitignore y no se sube al repositorio.
# ---------------------------------------------------------------------------
spring.application.name=gtm-modulo-tareas
spring.profiles.active=local

# Conexión a MySQL (base creada con sql/gtm_db_script.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/gtm_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
spring.datasource.username=root

# JPA / Hibernate
# ddl-auto=none: el esquema ya existe, Hibernate no debe crearlo ni modificarlo
spring.jpa.hibernate.ddl-auto=none
# false: las consultas se hacen solo dentro de la capa de servicio (buena práctica)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Thymeleaf: sin caché para ver los cambios de las plantillas al instante
spring.thymeleaf.cache=false

server.port=8080
